<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>从落雪到雪人</title>
<style>
body{background:#101d29;color:#eef6fa;font:18px/1.65 system-ui;margin:8vh auto;padding:0 24px;max-width:760px}
figure{margin:0;background:#203b50;border-radius:20px;padding:28px}
.sky{height:120px;text-align:center;letter-spacing:.6em;color:#cceaff}
.sill{border-top:14px solid #eef6fa;padding-top:8px}
.flow{color:#a8d5f0}
</style>
<h1>从落雪到雪人</h1>
<p>雪景叠在用户现有桌面上。系统继续显示原有壁纸和图标。</p>
<figure>
<div class="sky" aria-hidden="true">·　❄　·　❄<br>❄　·　❄　·<br>·　↘　↓　↙</div>
<div class="sill">窗台积雪　▁▂▃▃▂▁　（每格记录雪的厚度）</div>
<p class="flow">雪花落地 → 厚度增加 → 铲起积雪 → 滚成雪球 → 叠成雪人</p>
<figcaption>窗台和地面能托住积雪。竖直玻璃只保留少量附着的雪点，雪人放在更宽的地面上。</figcaption>
</figure>
<h2>桌面上的显示与操作</h2>
<ul>
<li>系统壁纸保持原样。透明效果层只绘制雪花、积雪和雪人，适用于静态或动态壁纸。</li>
<li>默认整层鼠标穿透，桌面图标照常点击、双击和拖动。启用雪铲或雪球后，仅指定玩雪区接收鼠标输入，按 Esc 退出。</li>
<li>积雪与雪人优先放在用户指定的桌面空白区。能可靠取得图标位置时，将图标和文字标签划为避让区。取不到时，使用手动指定的小范围玩雪区。</li>
</ul>
</html>
